d tips are handy for coloring larger areas. Finer tips are better for details and writing practice.\n- **Ease of use:** Look for caps that are easy to take off and put back on.\n- **Storage:** A box or tray that holds every marker keeps a set together and makes tidy-up quicker.\n- **Safety and supervision:** Follow the manufacturer’s age guidance and supervise young children while they use markers.","tipsTitle":"Fun Ways to Use Washable Markers","tips":"Washable markers can be used for much more than coloring pages. Here are a few simple ideas to try.\n\n- **Coloring pages:** Print coloring pages or let your child draw their own scene.\n- **Drawing challenges:** Try “draw your favorite animal in two minutes” or “draw a monster with three eyes”.\n- **Homemade cards:** Make birthday, thank-you or holiday cards for family and friends.\n- **Nature drawings:** After a walk, draw the leaves, flowers or bugs you spotted.\n- **Letter and number practice:** Trace letters and numbers in big, bright colors.\n- **Simple craft projects:** Decorate paper crowns, bookmarks or paper bags.","final":"A good set of washable markers can make creative time feel easier for everyone. Think about your child’s age, how many colors you need and how you plan to store them, then pick a set that fits.\n\nWhatever you choose, the best part is watching little artists make something that is all their own.","related":[],"draft":false,"img":"assets/images/washable-markers.jpg"},{"id":"easy-crafts-at-home","cat":"activities","motif":"pencils","date":"2026-10-13","draft":true,"title":"10 Easy Crafts Kids Can Make at Home","summary":"Coming soon.","intro":"","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false},{"id":"creative-toys","cat":"toys","motif":"star","date":"2026-10-13","draft":true,"title":"Best Creative Toys for Little Learners","summary":"Coming soon.","intro":"","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false},{"id":"act1","cat":"activities","motif":"rainbow","date":"2026-10-12","title":"10 Screen-Free Activities for Preschoolers","summary":"Ten easy ways to fill an afternoon with hands-on play that needs almost no setup.","intro":"Preschoolers learn best through play they can touch, move and repeat. These ideas use things most homes already have: a sensory bin of dry rice or pasta, a blanket fort, a scavenger hunt around the house, chalk on the pavement, a bowl of water with cups to pour, a pretend shop, a playdough kitchen, a scarf dance party, a sorting game with buttons or socks, and a story told with soft toys.\n\nPick one or two and save the rest for another day. Let your child lead and follow their questions. Five focused minutes often matters more than an hour of planned fun.\n\nTip: keep a small basket of open-ended items such as cardboard tubes, ribbons and clothespins so ideas are always within reach. Stay close during sensory play and keep small items away from children under three.","subtitle":"","products":[],"guideTitle":"What You’ll Need","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"act2","cat":"activities","motif":"pencils","date":"2026-10-09","title":"Easy Crafts for Kids","summary":"Low-mess craft projects that little hands can finish in under twenty minutes.","intro":"Short crafts keep young children interested from start to finish. Try paper plate rainbows, handprint animals, collages made from old magazine pages, or binoculars made from cardboard tubes and string.\n\nSet everything out before you begin, cover the table, and let your child make their own choices about colour and placement. The finished piece does not need to look like the example.\n\nDisplay the result on the fridge or a string across a wall. Children enjoy seeing their work treated as something worth showing.","subtitle":"","products":[],"guideTitle":"","guide":"You do not need everything on this list. Start with whatever you already have at home and choose a few items that fit the activity.

- Paper
- Crayons or washable markers
- Children’s books
- Building blocks
- Puzzles
- Playdough
- Child-safe scissors
- Glue
- Stickers
- Recycled boxes or containers
- Small toys

## 1. Coloring & Drawing
Set out paper and crayons or washable markers and invite your child to draw anything they like. There is no need for a perfect picture—let them choose the colors and ideas.

**Try this:** Draw a favorite animal, make a silly face, or create a picture using three simple shapes.

**Why kids may enjoy it:** They can make their own choices and turn simple marks and colors into something personal.

## 2. Simple Crafts
Choose an easy craft using paper, stickers, glue, or recycled materials. You can prepare any difficult cutting ahead of time and let your child handle the decorating.

**Try this:** Make a paper crown, create a sticker collage, or turn a recycled box into a small house for a toy.

**Why kids may enjoy it:** Crafting gives children a chance to create, decorate, and see an idea become something they can hold.

## 3. Story Time
Choose a favorite children’s book and read it together. Pause to look at the pictures, ask what might happen next, or let your child retell part of the story.

**Try this:** Use different voices for characters, act out a favorite scene, or make a simple picture bookmark.

**Why kids may enjoy it:** Stories invite imagination and give children a chance to participate instead of only listening.

## 4. Building With Blocks
Give your child building blocks and let them decide what to make. Start with a simple challenge and then let their imagination take over.

**Try this:** Build the tallest tower you can, make a home for a favorite toy, or create a road for toy cars.

**Why kids may enjoy it:** Building lets children experiment with different shapes, sizes, and ideas while creating something of their own.

## 5. Puzzles & Matching Games
Choose an age-appropriate puzzle or make a simple matching game with pictures, colors, or shapes. Keep the activity relaxed and offer help when needed.

**Try this:** Match pairs of pictures, find objects with the same color, or make a simple memory game using cards.

**Why kids may enjoy it:** Finding a match or completing a puzzle can feel like a fun little challenge with a clear finish.

## 6. Indoor Scavenger Hunt
Create a short list of safe things your child can find around the home. Give simple clues and let them search at their own pace.

**Try this:** Find something red, something soft, and something round. You can also make a color hunt or a toy hunt.

**Why kids may enjoy it:** A scavenger hunt turns an ordinary room into a small adventure.

## 7. Pretend Play
Set up a simple pretend-play activity using toys and everyday items. Follow your child’s idea and join the story when they invite you.

**Try this:** Play restaurant, open a pretend shop, or create a pretend pet-care center for stuffed animals.

**Why kids may enjoy it:** Pretend play gives children freedom to create their own stories and characters.

## 8. Playdough Fun
Give your child playdough and let them roll, squeeze, flatten, and shape it. Use only child-safe tools that are suitable for their age.

**Try this:** Make pretend cookies, create simple letters and shapes, or build a tiny playdough garden.

**Why kids may enjoy it:** Playdough is open-ended, so there are many different things children can make with it.

## 9. Sorting & Matching
Gather a few safe household items or toys and invite your child to sort them into groups. For younger children, use larger objects that are appropriate for their age.

**Try this:** Sort toys by color, group objects by size, or match socks and other safe pairs.

**Why kids may enjoy it:** Children can turn simple objects into a fun sorting game and choose their own way to make groups.

## 10. Nature Exploration
Take a short outdoor walk together or explore nature from a safe outdoor space. Encourage your child to notice what they see, hear, and feel.

**Try this:** Look for different leaf shapes, spot clouds in the sky, or find objects with interesting textures.

**Why kids may enjoy it:** Exploring outside gives children something new to notice and talk about while enjoying time together.","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"act3","cat":"activities","motif":"sun","date":"2026-10-07","title":"Indoor Activities for Rainy Days","summary":"Burn off energy and keep curiosity going when the weather keeps you inside.","intro":"A cushion obstacle course, a balloon that must not touch the floor, and an indoor treasure hunt all get children moving without much space. For quieter time, try kitchen science: ask your child to guess which objects sink or float, then test each one in a bowl of water.\n\nA cardboard box can become a car wash, a puppet theatre or a shop. Offer the box and a few markers, then step back.\n\nAlternate lively games with calm ones so the afternoon has a natural rhythm.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"act4","cat":"activities","motif":"star","date":"2026-10-03","title":"Creative Weekend Activities","summary":"Family-friendly ideas that turn an ordinary weekend into a small adventure.","intro":"Go on a nature walk and collect leaves, petals and pebbles to turn into a collage when you get home. Bake simple cookies together and let your child measure and stir. Build a cardboard city, or hold a family art show with a gallery tour and handmade tickets.\n\nChildren remember shared time more than the activity itself, so keep plans flexible and finish while everyone is still enjoying it.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"toy1","cat":"toys","motif":"rings","date":"2026-10-11","title":"Best Educational Toys for Preschoolers","summary":"What to look for when choosing toys that build skills and still feel like play.","intro":"The most useful preschool to d trying things. Building sets, magnets, measuring cups and balance scales all invite children to predict, test and adjust.\n\nWhile your child plays, ask open questions such as what do you think will happen, or how could we make it taller. For older children, simple circuit kits are a good next step.\n\nCelebrate mistakes. A tower that falls is information.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"cra1","cat":"crafts","motif":"palette","date":"2026-10-10","title":"Best Art Supplies for Kids","summary":"A starter list of safe, forgiving supplies for young artists.","intro":"Start with washable paints, chunky crayons, safety scissors, glue sticks, a big roll of paper and some modelling dough. Look for labels that say non-toxic and suit your child’s age.\n\nKeep supplies together on one tray or in a low box so your child can start without help. A smock and a wipeable mat make cleaning up quick and take the worry out of mess.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"cra2","cat":"crafts","motif":"rainbow","date":"2026-10-06","title":"Easy Painting Activities","summary":"Five ways to paint that go beyond the brush.","intro":"Try sponge painting, finger painting, ice-cube painting with a little watercolour in each tray, bubble wrap prints, and stamps cut from potatoes or peppers.\n\nTalk about what your child is doing rather than what it looks like: you mixed blue and yellow and made green. Process matters more than the picture.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"cra3","cat":"crafts","motif":"pencils","date":"2026-10-04","title":"Fun Craft Kits for Preschoolers","summary":"How to pick a craft kit that your child can finish happily.","intro":"A good preschool k  thick pages, a watercolour set, a tabletop easel, air-dry clay, stickers and a box of safe craft supplies all make good gifts.\n\nAdd a small apron and a note inviting your child to make something for you. The gift then comes with a first project.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"gif3","cat":"gifts","motif":"book","date":"2026-09-29","title":"Educational Birthday Gifts","summary":"Gifts that teach quietly while children enjoy them.","intro":"Books, puzzles, building sets, memory games and beginner science kits are all gifts that encourage learning through play.\n\nIf you are not sure what a child already owns, ask a parent. A short note about why you chose the gift makes it feel more personal.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false},{"id":"gif4","cat":"gifts","motif":"rainbow","date":"2026-09-27","title":"Screen-Free Gift Ideas","summary":"Gifts that get children moving, making and exploring.","intro":"Experience gifts such as a zoo or museum pass, a baking set, a small garden kit or outdoor games give children something to do together with family.\n\nWrap a clue about the plan inside a small box so there is something to open on the day.","subtitle":"","products":[],"guideTitle":"","guide":"","tipsTitle":"","tips":"","final":"","related":[],"affiliate":false,"draft":false}]}</script>

 {id:'washable-markers',cat:'crafts',motif:'pencils',date:'2026-10-14',affiliate:true,
  title:'7 Best Washable Markers for Kids',subtitle:'Fun Picks for Little Artists',
  summary:'Fun picks for little artists, creative play, coloring, and crafts.',
  intro:'Markers are one of the easiest ways to get kids drawing, coloring and making. For parents, caregivers and teachers, cleanup is often part of the decision, which is why washable markers are such a popular choice.\n\nIn this guide we share a washable marker pick for little artists, plus what to look for when you choose a set and fun ways to use them at home or in the classroom.',
  products:[{id:'p-crayola-40',name:'Crayola Ultra-Clean Washable Markers, 40 Count',
   desc:'This 40-count set offers a variety of bright colors for drawing, coloring, and creative projects. The washable design can make cleanup easier for parents and teachers after creative time.',
   why:'It is a big set with a wide range of bright colors, so there is plenty of choice for drawing, coloring and creative projects. The washable design can also make cleanup easier after creative time.',
   bestFor:'Parents and teachers who want a large variety of colors for drawing, coloring and craft projects.',url:'',img:''}],
  guideTitle:'What to Look for in Washable Markers',
  guide:'Not all markers are the same, and a few simple checks can help you choose a set that suits your child and your space.\n\n- **Age suitability:** Check the age range on the packaging and choose a size and grip that feel comfortable for your child.\n- **Washability:** Read the label to see what the markers are designed to wash from. If you are unsure, test on a small, hidden spot first.\n- **Number of colors:** Bigger sets give more choice for colorful projects. Smaller sets are easier to store and keep track of.\n- **Tip type:** Broad tips are handy for coloring larger areas. Finer tips are better for details and writing practice.\n- **Ease of use:** Look for caps that are easy to take off and put back on.\n- **Storage:** A box or tray that holds every marker keeps a set together and makes tidy-up quicker.\n- **Safety and supervision:** Follow the manufacturer’s age guidance and supervise young children while they use markers.',
  tipsTitle:'Fun Ways to Use Washable Markers',
  tips:'Washable markers can be used for much more than coloring pages. Here are a few simple ideas to try.\n\n- **Coloring pages:** Print coloring pages or let your child draw their own scene.\n- **Drawing challenges:** Try “draw your favorite animal in two minutes” or “draw a monster with three eyes”.\n- **Homemade cards:** Make birthday, thank-you or holiday cards for family and friends.\n- **Nature drawings:** After a walk, draw the leaves, flowers or bugs you spotted.\n- **Letter and number practice:** Trace letters and numbers in big, bright colors.\n- **Simple craft projects:** Decorate paper crowns, bookmarks or paper bags.',
  final:'A good set of washable markers can make creative time feel easier for everyone. Think about your child’s age, how many colors you need and how you plan to store them, then pick a set that fits.\n\nWhatever you choose, the best part is watching little artists make something that is all their own.'},
 {id:'easy-crafts-at-home',cat:'activities',motif:'pencils',date:'2026-10-13',draft:true,title:'10 Easy Crafts Kids Can Make at Home',summary:'Coming soon.'},
 {id:'creative-toys',cat:'toys',motif:'star',date:'2026-10-13',draft:true,title:'Best Creative Toys for Little Learners',summary:'Coming soon.'},
 {id:'act1',cat:'activities',motif:'rainbow',date:'2026-10-12',title:'10 Screen-Free Activities for Preschoolers',
  summary:'Ten easy ways to fill an afternoon with hands-on play that needs almost no setup.',
  body:'Preschoolers learn best through play they can touch, move and repeat. These ideas use things most homes already have: a sensory bin of dry rice or pasta, a blanket fort, a scavenger hunt around the house, chalk on the pavement, a bowl of water with cups to pour, a pretend shop, a playdough kitchen, a scarf dance party, a sorting game with buttons or socks, and a story told with soft toys.\n\nPick one or two and save the rest for another day. Let your child lead and follow their questions. Five focused minutes often matters more than an hour of planned fun.\n\nTip: keep a small basket of open-ended items such as cardboard tubes, ribbons and clothespins so ideas are always within reach. Stay close during sensory play and keep small items away from children under three.'},
 {id:'act2',cat:'activities',motif:'pencils',date:'2026-10-09',title:'Easy Crafts for Kids',
  summary:'Low-mess craft projects that little hands can finish in under twenty minutes.',
  body:'Short crafts keep young children interested from start to finish. Try paper plate rainbows, handprint animals, collages made from old magazine pages, or binoculars made from cardboard tubes and string.\n\nSet everything out before you begin, cover the table, and let your child make their own choices about colour and placement. The finished piece does not need to look like the example.\n\nDisplay the result on the fridge or a string across a wall. Children enjoy seeing their work treated as something worth showing.'},
 {id:'act3',cat:'activities',motif:'sun',date:'2026-10-07',title:'Indoor Activities for Rainy Days',
  summary:'Burn off energy and keep curiosity going when the weather keeps you inside.',
  body:'A cushion obstacle course, a balloon that must not touch the floor, and an indoor treasure hunt all get children moving without much space. For quieter time, try kitchen science: ask your child to guess which objects sink or float, then test each one in a bowl of water.\n\nA cardboard box can become a car wash, a puppet theatre or a shop. Offer the box and a few markers, then step back.\n\nAlternate lively games with calm ones so the afternoon has a natural rhythm.'},
 {id:'act4',cat:'activities',motif:'star',date:'2026-10-03',title:'Creative Weekend Activities',
  summary:'Family-friendly ideas that turn an ordinary weekend into a small adventure.',
  body:'Go on a nature walk and collect leaves, petals and pebbles to turn into a collage when you get home. Bake simple cookies together and let your child measure and stir. Build a cardboard city, or hold a family art show with a gallery tour and handmade tickets.\n\nChildren remember shared time more than the activity itself, so keep plans flexible and finish while everyone is still enjoying it.'},

 {id:'toy1',cat:'toys',motif:'rings',date:'2026-10-11',title:'Best Educational Toys for Preschoolers',
  summary:'What to look for when choosing toys that build skills and still feel like play.',
  body:'The most useful preschool toys can be used in more than one way. Stacking rings, wooden blocks, simple puzzles, pretend play sets and picture books all let children experiment, make choices and tell their own stories.\n\nLook for sturdy materials, a clear age label and pieces that suit your child’s hands. A toy that grows with your child, first for stacking and later for counting or sorting, will stay in use longer.\n\nCheck the label for small parts if there are younger siblings in the house.'},
 {id:'toy2',cat:'toys',motif:'rainbow',date:'2026-10-08',title:'10 Learning Toys That Make Play Fun',
  summary:'A quick tour of toy types that teach through play.',
  body:'Shape sorters, magnetic tiles, counting beads, alphabet puzzles, a play clock, building bricks, musical shakers, memory card games, balance toys and a pretend kitchen each support a different skill, from fine motor control to early maths and language.\n\nYou do not need all ten. Choose one or two that match what your child is curious about right now, and rotate them so play stays fresh.'},
 {id:'toy3',cat:'toys',motif:'sun',date:'2026-10-05',title:'Montessori-Inspired Toys for Little Learners',
  summary:'Simple, natural and child-sized: the ideas behind a calm play shelf.',
  body:'Montessori-inspired play favours toys with one clear purpose, made from natural materials and sized for small hands. A low shelf with a handful of choices helps children pick for themselves and put things back.\n\nRotate a few toys at a time instead of showing everything at once. Fewer options often lead to longer, more focused play.\n\nYou do not need special products to borrow the idea. Wooden spoons, bowls and a small jug can be just as useful.'},
 {id:'toy4',cat:'toys',motif:'star',date:'2026-10-01',title:'STEM Toys for Kids',
  summary:'Science, technology, engineering and maths, explained through things children can build and test.',
  body:'STEM play is about asking questions and trying things. Building sets, magnets, measuring cups and balance scales all invite children to predict, test and adjust.\n\nWhile your child plays, ask open questions such as what do you think will happen, or how could we make it taller. For older children, simple circuit kits are a good next step.\n\nCelebrate mistakes. A tower that falls is information.'},

 {id:'cra1',cat:'crafts',motif:'palette',date:'2026-10-10',title:'Best Art Supplies for Kids',
  summary:'A starter list of safe, forgiving supplies for young artists.',
  body:'Start with washable paints, chunky crayons, safety scissors, glue sticks, a big roll of paper and some modelling dough. Look for labels that say non-toxic and suit your child’s age.\n\nKeep supplies together on one tray or in a low box so your child can start without help. A smock and a wipeable mat make cleaning up quick and take the worry out of mess.'},
 {id:'cra2',cat:'crafts',motif:'rainbow',date:'2026-10-06',title:'Easy Painting Activities',
  summary:'Five ways to paint that go beyond the brush.',
  body:'Try sponge painting, finger painting, ice-cube painting with a little watercolour in each tray, bubble wrap prints, and stamps cut from potatoes or peppers.\n\nTalk about what your child is doing rather than what it looks like: you mixed blue and yellow and made green. Process matters more than the picture.'},
 {id:'cra3',cat:'crafts',motif:'pencils',date:'2026-10-04',title:'Fun Craft Kits for Preschoolers',
  summary:'How to pick a craft kit that your child can finish happily.',
  body:'A good preschool kit has few steps, large pieces and clear pictures. Check that the materials are non-toxic and that the age range matches your child.\n\nOr make your own: put paper shapes, glue, safety scissors and stickers in a box with a simple idea, such as make a robot, and let your child decide the rest.'},
 {id:'cra4',cat:'crafts',motif:'star',date:'2026-09-30',title:'Creative Craft Ideas for Kids',
  summary:'Turn recycling and everyday items into something new.',
  body:'Cardboard tubes become rockets, egg cartons become caterpillars, and old newspaper turns into paper chains. Smooth pebbles can be painted as ladybirds, and salt dough can be shaped into ornaments and baked.\n\nCollect a craft box through the week and let your child pick what to use. Having a choice makes children more invested in the finished piece.'},

 {id:'gif1',cat:'gifts',motif:'gift',date:'2026-10-13',title:'Best Gifts for 4-Year-Olds',
  summary:'Gift ideas that match how four-year-olds like to play.',
  body:'At four, children love pretend play, early puzzles, art supplies, picture books and active outdoor toys. Simple cooperative board games are a good way to practise turn-taking.\n\nThink about what your child already enjoys and pick something that adds to it. A set of dress-up pieces for a child who loves stories, or a chunky chalk set for one who draws on everything, will be used.'},
 {id:'gif2',cat:'gifts',motif:'palette',date:'2026-10-02',title:'Creative Gifts for Little Artists',
  summary:'Gifts that give young creators more ways to make things.',
  body:'A sketchbook with thick pages, a watercolour set, a tabletop easel, air-dry clay, stickers and a box of safe craft supplies all make good gifts.\n\nAdd a small apron and a note inviting your child to make something for you. The gift then comes with a first project.'},
 {id:'gif3',cat:'gifts',motif:'book',date:'2026-09-29',title:'Educational Birthday Gifts',
  summary:'Gifts that teach quietly while children enjoy them.',
  body:'Books, puzzles, building sets, memory games and beginner science kits are all gifts that encourage learning through play.\n\nIf you are not sure what a child already owns, ask a parent. A short note about why you chose the gift makes it feel more personal.'},
 {id:'gif4',cat:'gifts',motif:'rainbow',date:'2026-09-27',title:'Screen-Free Gift Ideas',
  summary:'Gifts that get children moving, making and exploring.',
  body:'Experience gifts such as a zoo or museum pass, a baking set, a small garden kit or outdoor games give children something to do together with family.\n\nWrap a clue about the plan inside a small box so there is something to open on the day.'}

function rich(text){

 function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
 function fp(){if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[];}}
 function fl(){if(list){out.push('<ul>'+list.map(function(i){return '<li>'+inl(i)+'</li>';}).join('')+'</ul>');list=null;}}
 String(text||'').split('\n').forEach(function(l){
  var t=l.trim();

 });
 fp();fl();return out.join('');
}

function buildDoc(){
 var css=document.getElementById('app-style').textContent;

  PAGE_HEAD+'<style id="app-style">'+css+'</style>\n<div id="app"></div>\n<div id="bar"></div>\n<div id="modal" hidden></div>\n'+
  '<script id="site-data" type="application/json">'+json+'<\/script>\n<script id="app-code">'+code+'<\/script>\n</body></html>';

function save(){
 if(!art||saving||!dirty)return;
 saving=true;statusMsg='';renderBar();
 var p;try{p=art.publish(buildDoc());}catch(e){p=Promise.reject(e);}
 p.then(function(){statusMsg='Saved. Loading the new version…';renderBar();},function(e){
  saving=false;var c=e&&e.code;
  if(c==='conflict')statusMsg='Someone saved at the same time. Loading the newest version…';
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')statusMsg='This view cannot save changes. Open the site from your own Claude account to edit it.';
  else if(c==='too_large')statusMsg='The site is too large to save. Try removing a cover photo or shortening an article.';
  else if(c==='rate_limited')statusMsg='Saving too often. Wait a moment, then try again.';
  else statusMsg='Saving did not work. Your changes are still here. Try again.';
  renderBar();
 });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target;if(!t||!t.closest)return;
 if(editing&&t.closest('[data-k]')){e.preventDefault();return;}
 var a=t.closest('[data-act]');
 if(a){
  e.preventDefault();var act=a.getAttribute('data-act'),id=a.getAttribute('data-id');
  if(act==='toggle-edit'){editing=!editing;confirmDel=null;render();}
  else if(act==='filter'){artFilter=a.getAttribute('data-cat')||'';render();}
  else if(act==='scroll-cats'){var el=document.getElementById('cats');if(el){var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});}}
  else if(act==='new-article')openEditor(null,a.getAttribute('data-cat'));
  else if(act==='edit-article')openEditor(id);
  else if(act==='del-ask'){confirmDel=id;render();}
  else if(act==='del-no'){confirmDel=null;render();}
  else if(act==='del-yes'){state.articles=state.articles.filter(function(x){return x.id!==id;});confirmDel=null;markDirty();if(route==='a-'+id)go('home');else render();}
  else if(act==='save')save();
  else if(act==='discard'){confirmDiscard=true;renderBar();}
  else if(act==='discard-no'){confirmDiscard=false;renderBar();}
  else if(act==='discard-yes'){state=clone(initial);dirty=false;confirmDiscard=false;statusMsg='';if(route.indexOf('a-')===0&&!findA(route.slice(2)))route='home';render();}
  else if(act==='m-save')saveEditor();
  else if(act==='p-add'){if(draft){draft.products.push(blankProduct());renderProducts();}}
  else if(act==='p-del'){if(draft){draft.products.splice(+a.getAttribute('data-pi'),1);renderProducts();}}
  else if(act==='pp-clear'){if(draft){draft.products[+a.getAttribute('data-pi')].img='';renderProducts();}}
  else if(act==='m-cancel')closeEditor();
  else if(act==='m-photo-clear'){if(draft){draft.img='';var n=document.getElementById('f-photo-note');if(n)n.textContent='No photo. The cover picture above is used.';}}
  return;
 }
 var r=t.closest('[data-r]');
 if(r){e.preventDefault();go(r.getAttribute('data-r'));}
});
document.addEventListener('input',function(e){
 var pf=e.target&&e.target.getAttribute?e.target.getAttribute('data-pf'):null;
 if(pf&&draft){var fs=e.target.closest('[data-pi]');if(fs)draft.products[+fs.getAttribute('data-pi')][pf]=e.target.value;return;}
 var el=e.target&&e.target.closest?e.target.closest('[data-k]'):null;
 if(!el||!editing)return;
 state.texts[el.getAttribute('data-k')]=el.textContent;markDirty();
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&!modal.hidden){closeEditor();return;}
 var el=e.target&&e.target.closest?e.target.closest('[data-k]'):null;
 if(el&&editing&&e.key==='Enter'&&!el.hasAttribute('data-ml')){e.preventDefault();el.blur();}
});
document.addEventListener('change',function(e){
 var t=e.target;if(!t||t.id!=='f-photo'||!assetsApi||!draft)return;
 var f=t.files&&t.files[0],note=document.getElementById('f-photo-note');if(!f)return;
 if(note)note.textContent='Uploading photo…';
 var p;try{p=assetsApi.upload(f);}catch(err){p=Promise.reject(err);}
 p.then(function(res){if(draft){draft.img=res.id;}if(note)note.textContent='Photo added.';},function(err){
  var c=err&&err.code,m='The photo could not be uploaded. Try a smaller image.';
  if(c==='too_large')m='That photo is too large. Try one under 20 MB.';
  else if(c==='unsupported_type')m='Use a PNG, JPEG, WebP or GIF photo.';
  else if(c==='not_granted'||c==='capability_disabled')m='Photo upload is not available in this view.';
  if(note)note.textContent=m;
 });
});
document.addEventListener('change',function(e){
 var t=e.target;if(!t||!t.getAttribute||!assetsApi||!draft)return;
 var pi=t.getAttribute('data-ppf');if(pi==null)return;
 var f=t.files&&t.files[0];if(!f)return;
 var note=document.getElementById('ppn-'+pi);if(note)note.textContent='Uploading photo\u2026';
 var p;try{p=assetsApi.upload(f);}catch(err){p=Promise.reject(err);}
 p.then(function(res){if(draft&&draft.products[+pi]){draft.products[+pi].img=res.id;renderProducts();}},function(err){
  var c=err&&err.code,m='The photo could not be uploaded. Try a smaller image.';
  if(c==='too_large')m='That photo is too large. Try one under 20 MB.';
  else if(c==='unsupported_type')m='Use a PNG, JPEG, WebP or GIF photo.';
  if(note)note.textContent=m;
 });
});
window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

/* ---------- start ---------- */
render();
(function(){
 var c=window.claude;if(!c||!c.use)return;
 c.use('user').then(function(u){return u?u.canEdit():false;}).then(function(ok){
  if(!ok)return;
  return c.use('artifact').then(function(a){
   if(!a)return;art=a;canEdit=true;
   return c.use('assets').then(function(s){assetsApi=s||null;},function(){});
  });
 }).then(function(){if(canEdit)render();},function(){});
})();
})();
</script>
